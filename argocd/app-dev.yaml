apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ci-demo-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aftab-devloper/ci-demo-config.git
    targetRevision: main
    path: overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: ci-demo-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
